<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CosaDoveQuando</title>
<meta name="description" content="CosaDoveQuando: sagre, mercatini, concerti e mostre vicino a te. Si parte dal Trentino.">
<link rel="stylesheet" href="/fonts.css">
<style>
:root{--corallo:#C8452A;--crema:#FFF4E6;--giallo:#F6C343;--scuro:#2A1712;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--corallo);color:var(--crema);font-family:var(--body);display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
main{max-width:640px;width:100%;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.eyebrow{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#FFE1C7}
h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,11vw,88px);line-height:.95;letter-spacing:-.03em;margin:0}
h1 span{color:var(--giallo)}
p{font-size:18px;line-height:1.5;margin:0;max-width:34em}
.zone{display:flex;flex-wrap:wrap;gap:10px}
a.btn{font-family:var(--display);font-weight:700;font-size:20px;background:var(--crema);color:var(--scuro);text-decoration:none;border-radius:999px;padding:12px 26px;display:inline-flex;align-items:center;gap:10px}
a.btn:focus-visible{outline:3px solid var(--giallo);outline-offset:3px}
.soon{font-size:15px;color:#FFE1C7}
.btn svg{width:22px;height:30px}
.brandrow{display:flex;align-items:center;gap:16px}
.wm{font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:-.035em;color:var(--crema)}
.wm span{color:var(--giallo)}
</style>
</head>
<body>
<main>
  <span class="brandrow"><svg class="logo" style="width:84px;height:72px" viewBox="0 0 92 78" role="img" aria-label="Logo CosaDoveQuando">
<g transform="translate(0 18)"><path d="M18 47 C8 35 0 27 0 18 A18 18 0 1 1 36 18 C36 27 28 35 18 47 Z" fill="#3B6FB6" transform="scale(1.25)"/><circle cx="22.5" cy="22.5" r="8" fill="#C8452A"/></g>
<g transform="translate(46 18)"><path d="M18 47 C8 35 0 27 0 18 A18 18 0 1 1 36 18 C36 27 28 35 18 47 Z" fill="#7A4BC9" transform="scale(1.25)"/><circle cx="22.5" cy="22.5" r="8" fill="#C8452A"/></g>
<g transform="translate(23 0)"><path d="M18 47 C8 35 0 27 0 18 A18 18 0 1 1 36 18 C36 27 28 35 18 47 Z" fill="#F6C343" transform="scale(1.25)"/><circle cx="22.5" cy="22.5" r="8" fill="#C8452A"/></g>
</svg><span class="wm">cosadove<span>quando</span></span></span>
  <h1>Eventi vicino<br>a <span>te</span>.</h1>
  <p>Sagre, mercatini, concerti e mostre, raccolti dalle fonti ufficiali e dagli organizzatori, ogni giorno.</p>
  <div class="zone">
    <a class="btn" href="/trentino/"><svg viewBox="0 0 36 48" aria-hidden="true"><path d="M18 47 C8 35 0 27 0 18 A18 18 0 1 1 36 18 C36 27 28 35 18 47 Z" fill="#C8452A"/><circle cx="18" cy="18" r="6" fill="#F6C343"/></svg>Trentino</a>
  </div>
  <span class="soon">Altre zone in arrivo. Contatti: <a href="mailto:info@cosadovequando.it" style="color:inherit;font-weight:700">info@cosadovequando.it</a> · <a href="/privacy/" style="color:inherit">Privacy</a></span>
</main>
</body>
</html>
