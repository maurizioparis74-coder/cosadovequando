name: Scarica i caratteri (una tantum)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/scarica-caratteri.yml']
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica i file woff2 da npm (Fontsource)
        run: |
          set -e
          mkdir -p fonts tmp && cd tmp
          npm pack @fontsource-variable/bricolage-grotesque@5.1.1 @fontsource/atkinson-hyperlegible@5.1.1
          for f in *.tgz; do tar xzf "$f" && mv package "${f%.tgz}"; done
          cp fontsource-variable-bricolage-grotesque-*/files/bricolage-grotesque-latin-wght-normal.woff2 ../fonts/
          cp fontsource-variable-bricolage-grotesque-*/files/bricolage-grotesque-latin-ext-wght-normal.woff2 ../fonts/
          cp fontsource-atkinson-hyperlegible-*/files/atkinson-hyperlegible-latin-400-normal.woff2 ../fonts/
          cp fontsource-atkinson-hyperlegible-*/files/atkinson-hyperlegible-latin-700-normal.woff2 ../fonts/
          cp fontsource-atkinson-hyperlegible-*/files/atkinson-hyperlegible-latin-ext-400-normal.woff2 ../fonts/
          cp fontsource-atkinson-hyperlegible-*/files/atkinson-hyperlegible-latin-ext-700-normal.woff2 ../fonts/
          cp fontsource-atkinson-hyperlegible-*/LICENSE ../fonts/LICENSE-atkinson-hyperlegible.txt || true
          cp fontsource-variable-bricolage-grotesque-*/LICENSE ../fonts/LICENSE-bricolage-grotesque.txt || true
          cd .. && rm -rf tmp && ls -la fonts
      - name: Salva nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add fonts
          git diff --cached --quiet || git commit -m "Aggiunge i caratteri ospitati sul sito (Bricolage Grotesque, Atkinson Hyperlegible)"
          git push
