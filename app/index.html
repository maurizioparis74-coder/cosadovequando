<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vicino a te · CosaDoveQuando (demo)</title>
<meta name="theme-color" content="#C8452A">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon-192.png">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vicino a te">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#FFFAF3;--fg:#2A1712;--card:#FFFFFF;--line:#EEDFD0;--muted:#7A5C52;--chip:#F7E9DA;
--corallo:#C8452A;--giallo:#F6C343;--crema:#FFF4E6;
--sagre:#C98A0C;--cultura:#3B6FB6;--concerti:#7A4BC9;--natura:#3E8A6E;--benessere:#12707A}
@media (prefers-color-scheme: dark){:root{--bg:#1D1210;--fg:#FFF4E6;--card:#2A1B17;--line:#3D2A24;--muted:#C9AFA4;--chip:#3A2721;
--sagre:#F0B53A;--cultura:#7FA6E0;--concerti:#B394EA;--natura:#6FC2A0;--benessere:#5FB8C0}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:1000;background:var(--corallo);color:#FFF4E6;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.row{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:34px;flex:none;background:#FFF4E6;border-radius:10px;padding:3px}
.wm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;letter-spacing:-.02em;line-height:1}
.wm span{color:var(--giallo)}
.demo{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px;letter-spacing:.04em;text-transform:uppercase}
.where{margin-top:10px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:0;border-radius:12px;padding:9px 12px;width:100%;text-align:left;color:#fff}
.where b{font-family:'Bricolage Grotesque',sans-serif;font-size:17px}
[hidden]{display:none!important}
.where small{margin-left:auto;opacity:.85;font-size:13px}
.ctrl{position:sticky;top:var(--toph,112px);z-index:999;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sub{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 0;font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
main{padding:10px 16px calc(env(safe-area-inset-bottom) + 24px)}
.ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;width:100%;text-align:left}
.km{flex:none;width:58px;border-radius:12px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px}
.km b{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;line-height:1}
.km span{font-size:11px;color:var(--muted);font-weight:700}
.ev .cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.ev h3{margin:2px 0 3px;font-family:'Bricolage Grotesque',sans-serif;font-size:17px;line-height:1.2}
.ev p{margin:0;font-size:14px;color:var(--muted)}
.tagdc{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;background:#FDF0D8;color:#7A4A00;border-radius:6px;padding:1px 6px}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.empty b{display:block;color:var(--fg);font-family:'Bricolage Grotesque',sans-serif;font-size:19px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--corallo);color:#fff;text-decoration:none}
.btn.sec{background:var(--chip);color:var(--fg)}
#mappa{height:calc(100vh - 230px);min-height:340px;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.welcome{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:6px}
.welcome h2{font-family:'Bricolage Grotesque',sans-serif;margin:0 0 6px;font-size:24px;line-height:1.1}
.welcome p{margin:0 0 14px;color:var(--muted)}
.welcome .btn{width:100%;margin-bottom:10px}
.priv{font-size:12px;color:var(--muted);margin-top:6px}
select,input[type=search]{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.sheet{position:fixed;inset:0;z-index:2000;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.pn h2{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;line-height:1.15;margin:4px 0 10px}
.fact{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.fact b{flex:none;width:76px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts .btn{font-size:15px}
.acts .full{grid-column:1/-1}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.leaflet-container{font:inherit}
.you{width:16px;height:16px;border-radius:50%;background:#2B7BE4;border:3px solid #fff;box-shadow:0 0 0 2px rgba(43,123,228,.35)}
.mk{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--corallo);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mk b{transform:rotate(45deg);color:#fff;font-size:12px}
.pop b{display:block;margin-bottom:4px}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 0;border-top:1px solid #eee;font-size:14px;color:#2A1712}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="row">
    <svg class="logo" viewBox="0 0 92 78" aria-hidden="true"><g transform="translate(0 18)"><path d="M18 47 C8 35 0 27 0 18 A18 18 0 1 1 36 18 C36 27 28 35 18 47 Z" fill="#3B6FB6" transform="scale(1.25)"/><circle cx="22.5" cy="22.5" r="8" fill="#C8452A"/></g><g transform="translate(46 18)"><path d="M18 47 C8 35 0 27 0 18 A18 18 0 1 1 36 18 C36 27 28 35 18 47 Z" fill="#7A4BC9" transform="scale(1.25)"/><circle cx="22.5" cy="22.5" r="8" fill="#C8452A"/></g><g transform="translate(23 0)"><path d="M18 47 C8 35 0 27 0 18 A18 18 0 1 1 36 18 C36 27 28 35 18 47 Z" fill="#F6C343" transform="scale(1.25)"/><circle cx="22.5" cy="22.5" r="8" fill="#C8452A"/></g></svg>
    <div class="wm">cosadove<span>quando</span></div>
    <span class="demo">Demo</span>
  </div>
  <button class="where" id="whereBtn" hidden><span>📍</span><b id="whereName">—</b><small>Cambia</small></button>
</header>

<div class="ctrl" id="ctrl" hidden>
  <div class="scroll" id="quando"></div>
  <div class="scroll" id="raggio" style="margin-top:8px"></div>
  <div class="scroll" id="cosa" style="margin-top:8px"></div>
  <div class="sub"><span id="conta">…</span><div class="seg"><button data-v="lista" class="on">Lista</button><button data-v="mappa">Mappa</button></div></div>
</div>

<main id="main"><div class="empty">Caricamento degli eventi…</div></main>

<div class="sheet" id="sheet"><div class="bd" data-close></div><div class="pn" id="pn"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const FEED='https://script.google.com/macros/s/AKfycbxEksOq1c2qYgumxE-w7qQR-7aNdT56V29dovnlKqs7h3BnMgxw0MspzhJagWXKqGoTFA/exec';
const TERR=['trentino','treviso'];
const CAT={sagre:['Sagre e feste','var(--sagre)'],cultura:['Cultura e mostre','var(--cultura)'],concerti:['Concerti e serate','var(--concerti)'],natura:['Natura e aria aperta','var(--natura)'],benessere:['Benessere','var(--benessere)']};
const CATKEY={'sagre e feste':'sagre','cultura e mostre':'cultura','concerti e serate':'concerti','natura e sport':'natura','natura e aria aperta':'natura','benessere e corsi':'benessere','eventi benessere':'benessere','benessere':'benessere'};
const QUANDO=[['oggi','Oggi'],['domani','Domani'],['weekend','Weekend'],['7','7 giorni'],['30','30 giorni']];
const RAGGI=[[5,'5 km'],[10,'10 km'],[25,'25 km'],[50,'50 km'],[0,'Tutti']];
const S={ev:[],com:{},pos:null,nome:'',quando:'oggi',raggio:25,cat:'tutte',vista:'lista',map:null,layer:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('cdq_'+k));localStorage.setItem('cdq_'+k,JSON.stringify(v))}catch(e){return null}}

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function range(q){const o=new Date();o.setHours(0,0,0,0);const a=new Date(o),b=new Date(o);
  if(q==='domani'){a.setDate(a.getDate()+1);b.setDate(b.getDate()+1)}
  else if(q==='weekend'){const g=o.getDay();if(g===6){b.setDate(b.getDate()+1)}else if(g!==0){a.setDate(a.getDate()+(6-g));b.setTime(a.getTime());b.setDate(b.getDate()+1)}}
  else if(q==='7'){b.setDate(b.getDate()+6)} else if(q==='30'){b.setDate(b.getDate()+29)}
  return [iso(a),iso(b)]}
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function fmtKm(d){return d<1?'<1':d<10?d.toFixed(1).replace('.',','):Math.round(d)}
const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'],GG=['dom','lun','mar','mer','gio','ven','sab'];
function fd(s){const d=new Date(s+'T00:00:00');return GG[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]}
function quandoTxt(e){return e.inizio===e.fine||!e.fine?fd(e.inizio):'dal '+fd(e.inizio)+' al '+fd(e.fine)}

async function carica(){
  const [com,...fs]=await Promise.all([fetch('/app/comuni.json').then(r=>r.json()),...TERR.map(t=>fetch(FEED+'?t='+t).then(r=>r.json()).catch(()=>({eventi:[]})))]);
  S.com=com;
  const trova=(t,c)=>{c=String(c||'');for(const n of [c,c.replace(/\s*\(.*\)\s*/,''),c.split(' / ')[0],(c.match(/\((.*)\)/)||[])[1]]){if(n&&com[t+'|'+n.trim()])return com[t+'|'+n.trim()]}return null};
  fs.forEach((f,i)=>(f.eventi||[]).forEach(e=>{const c=trova(TERR[i],e.comune);e.t=TERR[i];e.k=CATKEY[String(e.categoria||'').toLowerCase()]||'cultura';e.geo=c||null;S.ev.push(e)}));
}

function filtrati(){
  const [a,b]=range(S.quando);
  let l=S.ev.filter(e=>e.inizio<=b&&(e.fine||e.inizio)>=a&&(S.cat==='tutte'||e.k===S.cat));
  l.forEach(e=>e.d=e.geo&&S.pos?km(S.pos,e.geo):null);
  const senza=l.filter(e=>e.d===null).length;
  l=l.filter(e=>e.d!==null&&(!S.raggio||e.d<=S.raggio));
  l.sort((x,y)=>x.d-y.d||(x.inizio<y.inizio?-1:1));
  return {l,senza};
}

function chips(){
  $('#quando').innerHTML=QUANDO.map(([v,t])=>`<button class="chip ${S.quando===v?'on':''}" data-q="${v}">${t}</button>`).join('');
  $('#raggio').innerHTML='<span class="chip" style="border:0;background:none;padding-left:0;color:var(--muted)">Entro</span>'+RAGGI.map(([v,t])=>`<button class="chip ${S.raggio===v?'on':''}" data-r="${v}">${t}</button>`).join('');
  $('#cosa').innerHTML=`<button class="chip ${S.cat==='tutte'?'on':''}" data-c="tutte">Tutto</button>`+Object.entries(CAT).map(([k,[t,c]])=>`<button class="chip ${S.cat===k?'on':''}" data-c="${k}"><span class="dot" style="background:${c}"></span>${t}</button>`).join('');
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.quando=b.dataset.q;ls('quando',S.quando);aggiorna()});
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.raggio=+b.dataset.r;ls('raggio',S.raggio);aggiorna()});
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;aggiorna()});
}

function aggiorna(){
  chips();
  const {l,senza}=filtrati();
  const lab=QUANDO.find(q=>q[0]===S.quando)[1].toLowerCase();
  $('#conta').textContent=l.length+(l.length===1?' evento':' eventi')+(S.raggio?' entro '+S.raggio+' km':'')+' · '+lab;
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.vista));
  if(S.vista==='mappa'){mappa(l);return}
  if(S.map){S.map.remove();S.map=null}
  if(!l.length){$('#main').innerHTML=`<div class="empty"><b>Nessun evento qui</b>${S.raggio&&S.raggio<50?'Prova ad allargare il raggio o a cambiare periodo.':'Prova a cambiare periodo.'}${senza?'<br><br>'+senza+' eventi del periodo non hanno ancora una posizione.':''}</div>`;return}
  $('#main').innerHTML=l.map((e,i)=>`<button class="ev" data-i="${i}"><div class="km"><b>${fmtKm(e.d)}</b><span>km</span></div><div><div class="cat" style="color:${CAT[e.k][1]}">${CAT[e.k][0]}</div><h3>${esc(e.titolo)}</h3><p>${esc(e.comune)}${e.luogo?' · '+esc(e.luogo):''}</p><p>${quandoTxt(e)}${e.orari?' · '+esc(e.orari):''}</p>${e.daConfermare?'<span class="tagdc">Da confermare</span>':''}</div></button>`).join('')
   +(senza?`<div class="empty" style="padding:16px">${senza} eventi del periodo non hanno ancora una posizione e non compaiono qui.</div>`:'');
  document.querySelectorAll('.ev').forEach(b=>b.onclick=()=>dettaglio(l[+b.dataset.i]));
}

function mappa(l){
  $('#main').innerHTML='<div id="mappa"></div>';
  if(S.map){S.map.remove()}
  S.map=L.map('mappa',{zoomControl:true}).setView([S.pos.lat,S.pos.lng],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(S.map);
  L.marker([S.pos.lat,S.pos.lng],{icon:L.divIcon({className:'',html:'<div class="you"></div>',iconSize:[16,16]})}).addTo(S.map);
  if(S.raggio) L.circle([S.pos.lat,S.pos.lng],{radius:S.raggio*1000,color:'#C8452A',weight:1,fillOpacity:.04}).addTo(S.map);
  const g={};l.forEach(e=>{const k=e.geo.lat+','+e.geo.lng;(g[k]=g[k]||[]).push(e)});
  const pts=[[S.pos.lat,S.pos.lng]];
  Object.values(g).forEach(arr=>{const e0=arr[0];pts.push([e0.geo.lat,e0.geo.lng]);
    const m=L.marker([e0.geo.lat,e0.geo.lng],{icon:L.divIcon({className:'',html:`<div class="mk"><b>${arr.length}</b></div>`,iconSize:[30,30],iconAnchor:[15,30]})}).addTo(S.map);
    const div=document.createElement('div');div.className='pop';div.innerHTML=`<b>${esc(e0.comune)} · ${fmtKm(e0.d)} km</b>`;
    arr.forEach(e=>{const b=document.createElement('button');b.textContent=e.titolo;b.onclick=()=>dettaglio(e);div.appendChild(b)});
    m.bindPopup(div)});
  if(pts.length>1) S.map.fitBounds(pts,{padding:[30,30],maxZoom:13});
}

function ics(e){const d=e.inizio.replace(/-/g,''),f=new Date((e.fine||e.inizio)+'T00:00:00');f.setDate(f.getDate()+1);
  const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CosaDoveQuando//IT','BEGIN:VEVENT','UID:'+e.id+'@cosadovequando.it','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+iso(f).replace(/-/g,''),'SUMMARY:'+e.titolo,'LOCATION:'+[e.luogo,e.comune].filter(Boolean).join(', '),'DESCRIPTION:'+(e.orari?'Orari: '+e.orari+'. ':'')+'Da cosadovequando.it','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}));a.download=e.id+'.ics';a.click()}

function dettaglio(e){
  const dove=[e.luogo,e.comune].filter(Boolean).join(', ');
  const maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(dove+(e.t==='treviso'?', Treviso':', Trentino'));
  $('#pn').innerHTML=`<div class="grab"></div><div class="cat" style="color:${CAT[e.k][1]};font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${CAT[e.k][0]}</div><h2>${esc(e.titolo)}</h2>
   <div class="fact"><b>Quando</b><div>${quandoTxt(e)}${e.orari?'<br>'+esc(e.orari):''}</div></div>
   <div class="fact"><b>Dove</b><div>${esc(dove)}${e.d!=null?'<br><span style="color:var(--muted)">a circa '+fmtKm(e.d)+' km da te</span>':''}</div></div>
   ${e.nota?`<div class="fact"><b>Info</b><div>${esc(e.nota)}</div></div>`:''}
   ${e.daConfermare?`<div class="fact"><b>Nota</b><div>Da confermare con l'organizzatore${e.cosaManca?' ('+esc(e.cosaManca)+')':''}</div></div>`:''}
   <div class="acts">${e.link?`<a class="btn full" href="${esc(e.link)}" target="_blank" rel="noopener">Vedi l'evento</a>`:''}<a class="btn sec" href="${maps}" target="_blank" rel="noopener">Come arrivare</a><button class="btn sec" id="cal">Calendario</button>${navigator.share?'<button class="btn sec full" id="sh">Condividi</button>':''}</div>
   <div class="note">Le informazioni vengono dagli organizzatori: verificale sempre prima di partire. La distanza è calcolata dal centro del paese.</div>`;
  $('#cal').onclick=()=>ics(e);
  if($('#sh'))$('#sh').onclick=()=>navigator.share({title:e.titolo,text:e.titolo+' · '+quandoTxt(e)+' · '+e.comune,url:location.origin+'/'+e.t+'/'}).catch(()=>{});
  $('#sheet').classList.add('open');
}
document.querySelector('#sheet').addEventListener('click',ev=>{if(ev.target.dataset.close!==undefined)$('#sheet').classList.remove('open')});

function benvenuto(msg){
  $('#ctrl').hidden=true;$('#whereBtn').hidden=true;
  const comuni=[...new Set(Object.keys(S.com).filter(k=>S.com[k]).map(k=>k.split('|')[1]))].sort((a,b)=>a.localeCompare(b,'it'));
  $('#main').innerHTML=`<div class="welcome"><h2>Cosa c'è vicino a te?</h2><p>Trova sagre, concerti, mostre e feste intorno a te, in Trentino e nella Marca trevigiana.</p>
   ${msg?`<p style="color:var(--corallo);font-weight:700">${msg}</p>`:''}
   <button class="btn" id="gps">📍 Usa la mia posizione</button>
   <select id="sc"><option value="">…oppure scegli un paese</option>${comuni.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
   <div class="priv">La posizione resta sul tuo telefono: serve solo a calcolare le distanze e non viene inviata a nessuno.</div></div>`;
  $('#gps').onclick=gps;
  $('#sc').onchange=ev=>{const n=ev.target.value;if(!n)return;const k=Object.keys(S.com).find(k=>k.split('|')[1]===n&&S.com[k]);imposta({lat:S.com[k].lat,lng:S.com[k].lng},n)};
}
function gps(){
  if(!navigator.geolocation){benvenuto('Il telefono non permette di leggere la posizione: scegli un paese.');return}
  $('#gps').textContent='Cerco la posizione…';
  navigator.geolocation.getCurrentPosition(p=>{const pos={lat:p.coords.latitude,lng:p.coords.longitude};
    let best=null,bd=1e9;Object.entries(S.com).forEach(([k,c])=>{if(!c)return;const d=km(pos,c);if(d<bd){bd=d;best=k.split('|')[1]}});
    imposta(pos,bd<8?'Vicino a '+best:'La tua posizione')},
   err=>benvenuto(err.code===1?'Hai negato l\'accesso alla posizione: puoi riattivarlo nelle impostazioni del browser, oppure scegliere un paese.':'Posizione non disponibile: riprova o scegli un paese.'),
   {enableHighAccuracy:false,timeout:12000,maximumAge:300000});
}
function imposta(pos,nome){S.pos=pos;S.nome=nome;ls('pos',{pos,nome});$('#whereName').textContent=nome;$('#whereBtn').hidden=false;$('#ctrl').hidden=false;
  document.documentElement.style.setProperty('--toph',$('#top').offsetHeight+'px');aggiorna()}
$('#whereBtn').onclick=()=>benvenuto();
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.vista=b.dataset.v;aggiorna()});

(async()=>{
  try{await carica()}catch(e){$('#main').innerHTML='<div class="empty"><b>Non riusciamo a caricare gli eventi</b>Controlla la connessione e riprova.</div>';return}
  S.quando=ls('quando')||'oggi';const r=ls('raggio');if(r!==null&&r!==undefined)S.raggio=r;
  const p=ls('pos');if(p&&p.pos)imposta(p.pos,p.nome);else benvenuto();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/app/sw.js').catch(()=>{});
</script>
